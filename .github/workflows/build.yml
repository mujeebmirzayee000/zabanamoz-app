name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          flutter create app_project --platforms=android --project-name zabanamoz_app
          7z x -y zabanamoz_project.zip -oextracted
          rm -rf app_project/lib/*

          if [ -d "extracted/lib" ]; then
            cp -r extracted/lib/* app_project/lib/
          else
            cp -r extracted/* app_project/lib/
          fi

          find app_project/lib -name "main.dart" -exec cp {} app_project/lib/main.dart \;

          cd app_project

          flutter pub add provider supabase_flutter intl cupertino_icons
          
          sed -i '/dependencies:/a \  flutter_localizations:\n    sdk: flutter' pubspec.yaml

          flutter pub get
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
