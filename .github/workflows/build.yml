name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Project Files
        run: |
          unzip -o zabanamoz_project.zip -d extracted_project
          if [ -d "extracted_project/zabanamoz/app" ]; then
            cp -r extracted_project/zabanamoz/app/* .
          elif [ -d "extracted_project/app" ]; then
            cp -r extracted_project/app/* .
          else
            cp -r extracted_project/* .
          fi
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
