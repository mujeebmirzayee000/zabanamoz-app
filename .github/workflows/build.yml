name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت پروژه پایه اندروید
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # استخراج فایل زیپ شما
          7z x -y zabanamoz_project.zip -oextracted
          
          # پیدا کردن فایلی که واقعاً حاوی متد main() است
          REAL_MAIN=$(grep -rnwl "extracted" -e "void main" | head -n 1)
          
          if [ -z "$REAL_MAIN" ]; then
            REAL_MAIN=$(grep -rnwl "extracted" -e "main()" | head -n 1)
          fi
          
          echo "فایل اصلی برنامه پیدا شد در: $REAL_MAIN"
          
          # پاکسازی و انتقال کدهای شما به پوشه lib پروژه
          rm -rf app_project/lib/*
          
          # انتقال تمام فایل‌ها و زیرپوشه‌ها
          if [ -d "extracted/lib" ]; then
            cp -r extracted/lib/* app_project/lib/
          else
            cp -r extracted/* app_project/lib/
          fi
          
          # اطمینان از اینکه فایل دارای تابع main به عنوان main.dart اصلی قرار گیرد
          if [ -n "$REAL_MAIN" ]; then
            cp "$REAL_MAIN" app_project/lib/main.dart
          fi
          
          cd app_project
          
          # نصب مستقیم پکیج Supabase و پکیج‌های پایه مورد نیاز
          flutter pub add supabase_flutter
          
          # اگر فایل pubspec در زیپ بود کتابخانه‌های تعریف شده آن نیز خوانده شوند
          PUBSPEC=$(find ../extracted -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            # استخراج نام کتابخانه‌های اضافه شده و نصب خودکار آن‌ها
            awk '/dependencies:/{flag=1; next} /dev_dependencies:/{flag=0} flag' "$PUBSPEC" | grep -E '^  [a-zA-Z0-9_]+:' | awk -F: '{print $1}' | tr -d ' ' | while read -r pkg; do
              if [ "$pkg" != "flutter" ] && [ "$pkg" != "cupertino_icons" ]; then
                flutter pub add "$pkg" || true
              fi
            done
          fi
          
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
