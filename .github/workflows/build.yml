name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full

          # ساخت پروژه تمیز فلاتر
          flutter create zabanamoz_run --platforms=android --project-name zabanamoz --org com.radan.zabanamoz

          # استخراج محتویات زیپ در یک پوشه موقت
          mkdir -p temp_clean
          7z x -y zabanamoz_clean.zip -otemp_clean

          # کپی فایل اصلی برنامه روی پروژه پایه (بدون دستکاری پوشه اندروید)
          if [ -f temp_clean/lib/main.dart ]; then
            cp temp_clean/lib/main.dart zabanamoz_run/lib/main.dart
          fi

          cd zabanamoz_run

          # اضافه کردن پکیج‌های رسمی مورد نیاز با دستور مستقیم (بدون خطر خطای سینتکس در pubspec)
          flutter pub add supabase_flutter
          flutter pub add flutter_localizations --sdk=flutter

          # ساخت مستقیم APK
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
