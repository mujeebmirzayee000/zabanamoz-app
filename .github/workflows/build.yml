name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          7z x -y zabanamoz_project.zip -oextracted_project
          SRC=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Source found at: $SRC"
          cd "$SRC"
          
          # استخراج نام پکیج از pubspec.yaml به شکل خودکار
          PKG_NAME=$(grep '^name:' pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r\n')
          echo "Project name is: $PKG_NAME"
          
          # ساخت یک پروژه موقت فقط برای گرفتن پوشه اندروید
          flutter create /tmp/temp_flutter --platforms=android --project-name "$PKG_NAME"
          cp -r /tmp/temp_flutter/android .
          
          flutter pub get
          flutter build apk --release
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
