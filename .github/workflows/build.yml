name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت پایه سالم پروژه فلاتر
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # استخراج محتوای زیپ
          7z x -y zabanamoz_project.zip -oextracted
          
          # انتقال هوشمند ساختار کدهای اصلی
          rm -rf app_project/lib/*
          if [ -d "extracted/lib" ]; then
            cp -r extracted/lib/* app_project/lib/
          else
            # اگر پوشه lib در ریشه نبود، عمیق‌ترین پوشه حاوی main.dart پیدا شود
            MAIN_FILE=$(find extracted -name "main.dart" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
              SRC_DIR=$(dirname "$MAIN_FILE")
              cp -r "$SRC_DIR"/* app_project/lib/
            else
              cp -r extracted/* app_project/lib/
            fi
          fi
          
          cd app_project
          
          # افزودن پکیج‌های پیش‌نیاز شناسایی‌شده در خطاها
          flutter pub add provider supabase_flutter flutter_localizations --sdk=flutter intl
          
          # در صورت وجود pubspec اختصاصی در زیپ، سایر پکیج‌ها نیز استخراج و نصب شوند
          PUBSPEC=$(find ../extracted -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            awk '/dependencies:/{flag=1; next} /dev_dependencies:/{flag=0} flag' "$PUBSPEC" | grep -E '^  [a-zA-Z0-9_]+:' | awk -F: '{print $1}' | tr -d ' ' | while read -r pkg; do
              if [ "$pkg" != "flutter" ] && [ "$pkg" != "cupertino_icons" ] && [ "$pkg" != "flutter_localizations" ]; then
                flutter pub add "$pkg" || true
              fi
            done
          fi
          
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
