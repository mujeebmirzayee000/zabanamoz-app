name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # استخراج فایل‌های فشرده
          7z x -y zabanamoz_project.zip -oextracted
          
          # پیدا کردن مسیر دقیق پوشه حاوی pubspec.yaml اصلی فلاتر
          APP_DIR=$(find extracted -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "پوشه پروژه فلاتر پیدا شد: $APP_DIR"
          
          cd "$APP_DIR"
          
          # اگر پوشه اندروید نیتیو داخل پروژه نبود، به صورت خودکار ایجاد شود
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

          # دریافت پکیج‌های تعریف‌شده در pubspec اصلی
          flutter pub get
          
          # کامپایل خروجی APK
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
