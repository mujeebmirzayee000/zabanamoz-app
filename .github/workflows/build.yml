name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت یک پروژه کامل با پوشه اندروید نیتیو
          flutter create zabanamoz_app --platforms=android --project-name zabanamoz_app
          
          # استخراج در یک پوشه موقت
          mkdir -p extracted_files
          7z x -y zabanamoz_project.zip -oextracted_files
          
          # پیدا کردن محل فایل pubspec.yaml اصلی شما در فایل زیپ
          SOURCE_DIR=$(find extracted_files -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          
          # انتقال تمام کدهای پروژه شما روی پروژه جدید (حفظ پوشه اندروید و جایگزینی فایل‌های اصلی)
          cp -rf "$SOURCE_DIR"/* zabanamoz_app/
          
          cd zabanamoz_app
          
          # دریافت پکیج‌ها و ساخت نهایی APK
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
