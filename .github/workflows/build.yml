name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت یک پروژه کامل و سالم اندروید
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # پاک کردن کدهای نمونه فلاتر
          rm -rf app_project/lib/*
          
          # استخراج فایل‌های پروژه شما و انتقال به پروژه فلاتر
          7z x -y zabanamoz_project.zip -oextracted
          
          # اگر پوشه lib در فایل زیپ بود محتوای آن کپی شود، در غیر این صورت کل فایل‌ها منتقل شوند
          if [ -d "extracted/lib" ]; then
            cp -r extracted/lib/* app_project/lib/
            [ -f extracted/pubspec.yaml ] && cp extracted/pubspec.yaml app_project/
          else
            # جستجوی فایل main.dart
            MAIN_FILE=$(find extracted -name "main.dart" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
              SRC_DIR=$(dirname "$MAIN_FILE")
              cp -r "$SRC_DIR"/* app_project/lib/
            else
              cp -r extracted/* app_project/lib/
            fi
          fi
          
          cd app_project
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
