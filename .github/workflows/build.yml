name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          mkdir -p extracted_src
          7z x -y zabanamoz_project.zip -oextracted_src
          flutter create --project-name zabanamoz_app zabanamoz_app
          cp -r extracted_src/* zabanamoz_app/ 2>/dev/null  true
          find extracted_src -name "lib" -type d -exec cp -r {} zabanamoz_app/ \; 2>/dev/null  true
          find extracted_src -name "pubspec.yaml" -exec cp {} zabanamoz_app/ \; 2>/dev/null || true
          cd zabanamoz_app
          flutter pub get
          flutter build apk --release
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
