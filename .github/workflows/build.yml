name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت پروژه پایه فلاتر
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # استخراج فایل‌های پروژه
          7z x -y zabanamoz_project.zip -oextracted
          
          # انتقال تمام کدهای دارت به پوشه lib
          rm -rf app_project/lib/*
          if [ -d "extracted/lib" ]; then
            cp -r extracted/lib/* app_project/lib/
          else
            MAIN_FILE=$(find extracted -name "main.dart" | head -n 1)
            if [ -n "$MAIN_FILE" ]; then
              SRC_DIR=$(dirname "$MAIN_FILE")
              cp -r "$SRC_DIR"/* app_project/lib/
            else
              cp -r extracted/* app_project/lib/
            fi
          fi
          
          # تنظیم دقیق pubspec.yaml با تمام پکیج‌های پروژه
          cat << 'EOF' > app_project/pubspec.yaml
          name: zabanamoz_app
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: any
            provider: any
            supabase_flutter: any
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          cd app_project
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
