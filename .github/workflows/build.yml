name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # استخراج فایل‌های فشرده پروژه
          7z x -y zabanamoz_project.zip -oextracted
          
          # پیدا کردن مسیر دقیق پوشه اپلیکیشن
          APP_DIR=$(find extracted -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          cd "$APP_DIR"
          
          # پشتیبان‌گیری از کدهای اصلی پروژه
          mkdir -p /tmp/original_lib
          cp -r lib/* /tmp/original_lib/
          cp pubspec.yaml /tmp/original_pubspec.yaml

          # ایجاد پوشه اندروید نیتیو
          flutter create . --platforms=android --project-name zabanamoz_app
          
          # بازگرداندن فایل‌های اصلی پروژه زبان‌آموز
          rm -rf lib/*
          cp -r /tmp/original_lib/* lib/
          cp /tmp/original_pubspec.yaml pubspec.yaml

          # دریافت وابستگی‌های اصلی و ساخت فایل نصبی اپلیکیشن
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
