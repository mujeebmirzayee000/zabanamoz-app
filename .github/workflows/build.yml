name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # استخراج فایل‌های فشرده پروژه
          7z x -y zabanamoz_project.zip -oextracted
          
          # پیدا کردن مسیر دقیق پروژه اصلی که pubspec.yaml در آن است
          APP_DIR=$(find extracted -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "App directory is: $APP_DIR"
          
          # ساخت یک پروژه موقت فقط برای استخراج پوشه اندروید
          flutter create temp_android_holder --platforms=android --project-name zabanamoz_app
          
          # اگر پوشه اندروید در پروژه اصلی نبود، آن را اضافه می‌کنیم
          if [ ! -d "$APP_DIR/android" ]; then
            cp -r temp_android_holder/android "$APP_DIR/"
          fi
          
          # ورود به پوشه برنامه اصلی
          cd "$APP_DIR"
          
          # دریافت پکیج‌ها و خروجی گرفتن نهایی
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
