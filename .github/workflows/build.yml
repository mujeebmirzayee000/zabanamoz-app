name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت یک پروژه خام فلاتر
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # استخراج فایل زیپ شما
          7z x -y zabanamoz_project.zip -oextracted
          
          echo "=== لیست تمام فایل‌های داخل فایل زیپ شما ==="
          find extracted
          echo "==========================================="
          
          # بررسی وجود main.dart در فایل‌های استخراج‌شده
          MAIN_PATH=$(find extracted -name "main.dart" | head -n 1)
          
          if [ -n "$MAIN_PATH" ]; then
            echo "فایل اصلی پیدا شد: $MAIN_PATH"
            SRC_DIR=$(dirname "$MAIN_PATH")
            rm -rf app_project/lib/*
            cp -r "$SRC_DIR"/* app_project/lib/
          else
            echo "فایل main.dart با این نام وجود ندارد، جستجوی اولین فایل با پسوند dart..."
            FIRST_DART=$(find extracted -name "*.dart" | head -n 1)
            if [ -n "$FIRST_DART" ]; then
              echo "فایل پیدا شد و به عنوان main.dart تعیین می‌شود: $FIRST_DART"
              SRC_DIR=$(dirname "$FIRST_DART")
              rm -rf app_project/lib/*
              cp -r "$SRC_DIR"/* app_project/lib/
              cp "$FIRST_DART" app_project/lib/main.dart
            fi
          fi
          
          # کپی فایل تنظیمات پکیج در صورت وجود
          PUBSPEC=$(find extracted -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            cp "$PUBSPEC" app_project/pubspec.yaml
          fi
          
          cd app_project
          flutter pub get
          flutter build apk --release
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
