name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          
          # ساخت پروژه پایه فلاتر
          flutter create app_project --platforms=android --project-name zabanamoz_app
          
          # استخراج فایل‌های زیپ
          7z x -y zabanamoz_project.zip -oextracted
          
          # پاکسازی فایل‌های پیش‌فرض فلاتر
          rm -rf app_project/lib/*
          
          # کپی تمام فایل‌های استخراج شده به پوشه lib
          cp -r extracted/* app_project/lib/
          
          # جستجوی فایل اصلی برنامه
          MAIN_FILE=$(find app_project/lib -name "main.dart" | head -n 1)
          
          if [ -n "$MAIN_FILE" ]; then
            echo "فایل main.dart پیدا شد: $MAIN_FILE"
            ENTRY_TARGET="$MAIN_FILE"
          else
            # اگر main.dart نبود، فایلی که حاوی تابع main است را پیدا می‌کند
            ENTRY_TARGET=$(grep -rnwl "app_project/lib" -e "void main" | head -n 1)
            if [ -z "$ENTRY_TARGET" ]; then
              ENTRY_TARGET=$(grep -rnwl "app_project/lib" -e "main()" | head -n 1)
            fi
            echo "فایل دارای نقطه شروع پیدا شد: $ENTRY_TARGET"
          fi
          
          # اگر همچنان پیدا نشد اولین فایل دارت را انتخاب می‌کند
          if [ -z "$ENTRY_TARGET" ]; then
            ENTRY_TARGET=$(find app_project/lib -name "*.dart" | head -n 1)
            echo "اولین فایل دارت انتخاب شد: $ENTRY_TARGET"
          fi
          
          # کپی فایل پیدا شده دقیقا در ریشه پوشه lib به نام main.dart
          cp "$ENTRY_TARGET" app_project/lib/main.dart
          
          # تنظیم فایل وابستگی‌ها
          cat << 'EOF' > app_project/pubspec.yaml
          name: zabanamoz_app
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: any
            provider: any
            supabase_flutter: any
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          cd app_project
          flutter pub get
          flutter build apk --release -t lib/main.dart
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
